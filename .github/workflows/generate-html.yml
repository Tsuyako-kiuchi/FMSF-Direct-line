name: Generate HTML from Excel and Deploy to Pages

on:
  push:
    paths:
      - 'data.xlsx'
  workflow_dispatch:

permissions:
  contents: read   # リポジトリのチェックアウトに必要
  pages: write     # GitHub Pagesのデプロイに必要
  id-token: write  # OIDC認証に必要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # v3 から v4 に更新

      - name: Set up Python
        uses: actions/setup-python@v5 # v4 から v5 に更新
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl

      - name: Generate HTML
        run: |
          python generate_html.py
          # index.html がリポジトリのルートに生成されることを想定しています。

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4 # v3 から v4 に更新
        with:
          path: './' # 生成された index.html があるディレクトリを指定します。

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # build ジョブが完了してから実行します
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # v3 から v4 に更新